<!DOCTYPE html>
<html>
<head>
  <title>Certificate Generator</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 400px; margin: 60px auto; }
    input, button { width: 100%; padding: 10px; margin: 8px 0; font-size: 16px; }
    button { background: #2c5282; color: white; border: none; cursor: pointer; }
  </style>
</head>
<body>
  <h2>Certificate Generator</h2>
  <form action="/generate" method="POST">
    <input type="text" name="roll" placeholder="Roll number">
    <input type="text" name="name" placeholder="Student name">
    <button type="submit">Generate Certificate</button>
  </form>
</body>
</html>
